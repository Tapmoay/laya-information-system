# 信息源库 —— 我们会去哪些地方找东西，以及每个源凭什么值得每天抓。
#
# v2 相对 v1 加的是分类法。一个源不只回答"这是什么主题"，还要回答：
#   field   内容讲哪个领域          → 决定它会不会挤占别的领域的名额
#   kind    内容是怎么产出的        → 决定信息密度与时效（预印本和媒体编译差一个量级）
#   role    它服务用户的哪个目标    → 决定进核心位、任务位还是探索位
#   serves  它具体喂哪个目标或任务  → 说不出喂什么，就不该被每天抓
# 任何一项缺失或不在分类法里，tools/source_index.py --check 会当场报错。
#
# 路径正则不是猜的：它等于我们对"这个站点的文章长什么样"的唯一断言。
# 写错了会当场少抓或抓错，而抓错的内容会以"质量分低"的形式悄悄污染标定数据。
# 每一条都标注了验证状态：
#   VERIFIED —— 实测能抓到正文（正文长度、编码、标题都核对过）
#   UNSTABLE —— 能抓到但列表噪声大（导航链接混进文章链接）
#   UNVERIFIED —— 登记了但还没实测
#
# 注意：select_links 会先去掉路径尾部的斜杠再匹配正则，所以 pattern 里不要写 /$ 。
schema: 2

defaults:
  timeout_seconds: 20
  max_attempts: 2
  max_bytes: 3000000
  respect_robots: true
  user_agent: "LAYA-personal-information/0.1"

taxonomy:
  field:
    ai: "AI 模型、智能体、AI 工程与评测"
    security: "网络安全、逆向工程、漏洞与攻防研究"
    engineering: "软件工程、系统架构、分布式与运维实践"
    tooling: "数字工具、效率方法与软硬件使用"
    design: "视觉设计、平面与交互、广告创意"
    art: "当代艺术、装置、影像与艺术批评"
    architecture: "建筑、空间与构成"
    music: "音乐制作、声音设计与音频设备"
    culture: "游戏、亚文化与叙事"
    philosophy: "思想、哲学与伦理"
    business: "科技商业、产业与资本动向"
  kind:
    preprint: "学术预印本：有摘要、有方法、可回溯到 abs 页"
    aggregator: "人工或 AI 精编的聚合，每条都带一手来源链接"
    lab_release: "机构一手公告、更新日志、官方技术博客"
    engineering_blog: "工程团队或从业者的技术长文"
    media: "行业媒体的报道与编译"
    critique: "批评、评论与策展，作品与分析并重"
    community: "社区讨论：从业者的实际抱怨与经验，密度低但环境价值高"
  role:
    core: "服务长期主要方向，应该每天都看一眼"
    task: "服务当前任务；任务换了，它就跟着换"
    explore: "跨领域或陌生视角，主要喂探索位"
    control: "同主题低密度对照源，用来暴露「凡是 AI 就收」这类偏差"
  density:
    high: "读完能拿到机制、数据或可复现的做法"
    medium: "有事实和判断，但还需要往一手材料追一层"
    low: "以消息和观点为主，认知增量有限"

targets:
  goals:
    - id: goal-agent-systems
      tier: T1
      statement: "主方向：示例领域 A（换成你自己的长期方向）"
    - id: goal-visual-narrative
      tier: T2
      statement: "第二方向：示例领域 B（可留空）"
    - id: goal-security
      tier: T3
      statement: "第三方向：示例领域 C（可留空）"
  tasks:
    - id: task-ai-agent
      tier: T0
      statement: "当前任务：示例任务（换成你正在推进的事）（2026-10-24 起的当前任务）"
    - id: task-security-foundation
      tier: T0
      statement: "网络安全基础与授权渗透测试入门（可在候选池里切换）"
    - id: task-system-build
      tier: T0
      statement: "系统构建：把要做的东西真的搭起来，而不是只读别人的做法"
    - id: task-ai-project
      tier: T0
      statement: "其他 AI 项目：模型、工具链、评测与自用系统"
    - id: task-virtual-intelligence
      tier: T0
      statement: "虚拟聚生智能：虚拟的 AI 人、AI 伴侣、AI 直播（含二次元虚拟主播）"

sources:
  # ── 学术预印本：这是"方法论与可复现"最集中的一类来源 ──────────────
  - id: SRC-ARXIV-CS-AI
    name: arXiv cs.AI 最新
    field: ai
    kind: preprint
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-project, task-ai-agent]
    per_source: 6
    why: "AI 的通用方法层；摘要本身就是一份完整的机制说明，比媒体转述可信得多"
    indexes:
      - url: "https://arxiv.org/list/cs.AI/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-ARXIV-CS-CL
    name: arXiv cs.CL 最新
    field: ai
    kind: preprint
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-project, task-virtual-intelligence, task-ai-agent]
    per_source: 6
    why: "语言模型与评测的主战场；新方法与失败案例都先出现在这里。角色扮演、人格一致性、长期对话记忆都在这一类里，也正是虚拟人最先要解决的问题"
    indexes:
      - url: "https://arxiv.org/list/cs.CL/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-ARXIV-CS-LG
    name: arXiv cs.LG 最新
    field: ai
    kind: preprint
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-agent]
    per_source: 6
    why: "训练与推理的底层机制；判断一个模型说法是否站得住，要靠这一层"
    indexes:
      - url: "https://arxiv.org/list/cs.LG/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-ARXIV-CS-SE
    name: arXiv cs.SE 最新
    field: engineering
    kind: preprint
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [task-system-build, goal-agent-systems]
    per_source: 6
    why: "软件开发本身的研究：契约、测试、代码生成、可维护性；系统构建最缺的就是这类可检验结论"
    indexes:
      - url: "https://arxiv.org/list/cs.SE/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-ARXIV-CS-CR
    name: arXiv cs.CR 最新
    field: security
    kind: preprint
    role: task
    language: en
    density: high
    status: VERIFIED
    serves: [goal-security, task-security-foundation]
    per_source: 6
    why: "安全里少数能把攻击与防御讲到可复现程度的来源；安全媒体大多是二次转述"
    indexes:
      - url: "https://arxiv.org/list/cs.CR/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
