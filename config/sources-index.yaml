  - id: SRC-ARXIV-CS-MA
    name: arXiv cs.MA 多智能体
    field: ai
    kind: preprint
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems]
    per_source: 6
    why: "多智能体协作与涌现行为。注意它和「虚拟聚生智能」不是一回事——后者是虚拟人/伴侣，不是一个系统里多个智能体协作"
    indexes:
      - url: "https://arxiv.org/list/cs.MA/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-ARXIV-CS-RO
    name: arXiv cs.RO 机器人
    field: ai
    kind: preprint
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems]
    per_source: 5
    why: "具身智能：智能体有了身体之后，哪些结论会变、哪些会失效"
    indexes:
      - url: "https://arxiv.org/list/cs.RO/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-ARXIV-CS-HC
    name: arXiv cs.HC 人机交互
    field: design
    kind: preprint
    role: explore
    language: en
    density: high
    status: VERIFIED
    serves: [goal-visual-narrative, task-virtual-intelligence]
    per_source: 5
    why: "人怎么读、怎么误读界面；示例第二方向要落地，绕不开这一层实证。虚拟主播「像不像人」也归这里"
    indexes:
      - url: "https://arxiv.org/list/cs.HC/recent"
        pattern: '^/abs/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  - id: SRC-HF-PAPERS
    name: Hugging Face Papers
    field: ai
    kind: preprint
    role: core
    language: en
    density: high
    network: proxy
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-project, task-virtual-intelligence, task-ai-agent]
    per_source: 6
    why: "带社区讨论的论文榜单：同一篇论文有没有人复现、有没有人骂，比摘要本身更有用。直连被阻断，必须走代理"
    indexes:
      - url: "https://huggingface.co/papers"
        pattern: '^/papers/\d{4}\.\d{4,5}$'
        min_anchor_chars: 8

  # ── 聚合：一手链接可回溯，适合快速扫一遍发生了什么 ────────────────
  - id: SRC-AIHOT
    name: AIHOT AI 日报
    field: ai
    kind: aggregator
    role: core
    language: zh-Hans
    density: medium
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-project, task-virtual-intelligence, task-ai-agent]
    per_source: 10
    why: "每天 08:00 的精编日报，每条都标了原始来源并能跳回原文；适合快速判断「今天有没有值得深挖的东西」，不适合代替一手材料"
    indexes:
      - url: "https://aihot.news/all"
        pattern: '^/items/[a-z0-9]+$'
        min_anchor_chars: 8
        limit: 12
      - url: "https://aihot.news/daily"
        pattern: '^/items/[a-z0-9]+$'
        min_anchor_chars: 8
        limit: 6

  # ── 一手公告与技术博客 ──────────────────────────────────────────
  - id: SRC-ANTHROPIC
    name: Anthropic News
    field: ai
    kind: lab_release
    role: core
    language: en
    density: medium
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-agent]
    per_source: 5
    why: "模型能力边界的一手说法；判断二手解读是否夸大，只能回到这里"
    indexes:
