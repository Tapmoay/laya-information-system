        pattern: '^/news/[a-z0-9-]+$'
        min_anchor_chars: 8

  - id: SRC-LILIANWENG
    name: Lil'Log（翁丽莲）
    field: ai
    kind: engineering_blog
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-agent]
    per_source: 5
    why: "把一个方向的论文串成一条线，正好补上「读单篇论文看不出全局」这个缺口"
    indexes:
      - url: "https://lilianweng.github.io/"
        pattern: '^/posts/\d{4}-\d{2}-\d{2}-[a-z0-9-]+$'
        min_anchor_chars: 0

  - id: SRC-SIMONW
    name: Simon Willison's Weblog
    field: ai
    kind: engineering_blog
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-project, task-ai-agent]
    per_source: 6
    why: "动手试出来的结论，常带失败案例与可复现代码；比发布会更接近「这东西实际能干什么」"
    indexes:
      - url: "https://simonwillison.net/"
        pattern: '^/\d{4}/[A-Z][a-z]{2}/\d{1,2}/[a-z0-9-]+$'
        min_anchor_chars: 8
        # 他有一类 /sighting-NNNN/ 的观鸟记录，实测正文 589 字、信息密度为零。
        # 排掉它不是在挑观点，是政策 §2 那条「密度低的一律不要」。
        exclude: ["/sighting-"]

  - id: SRC-MARTINFOWLER
    name: martinfowler.com
    field: engineering
    kind: engineering_blog
    role: core
    language: en
    density: high
    status: VERIFIED
    serves: [task-system-build, goal-agent-systems]
    per_source: 5
    why: "系统构建里的取舍怎么写清楚；架构决策的表述方式本身值得学"
    indexes:
      - url: "https://martinfowler.com/"
        pattern: '^/articles/[a-z0-9-]+\.html$'
        min_anchor_chars: 8

  - id: SRC-CLOUDFLARE
    name: Cloudflare Blog
