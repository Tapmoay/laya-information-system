    indexes:
      - url: "https://blog.cloudflare.com/"
        pattern: '^/[a-z][a-z0-9-]{9,}$'
        min_anchor_chars: 8

  - id: SRC-HF-BLOG
    name: Hugging Face Blog
    field: ai
    kind: engineering_blog
    role: explore
    language: en
    density: medium
    network: proxy
    status: VERIFIED
    serves: [goal-agent-systems, task-ai-project, task-ai-agent]
    per_source: 5
    why: "社区作者写的实践长文，密度参差；价值在于「有人真的这么做了一遍」。直连被阻断，必须走代理"
    indexes:
      - url: "https://huggingface.co/blog"
        pattern: '^/blog/[A-Za-z0-9._-]+(/[a-z0-9-]+)?$'
        min_anchor_chars: 8
        exclude: ["/blog/community"]

  # ── 安全：一手研究，不是安全新闻 ────────────────────────────────
  - id: SRC-CHECKPOINT
    name: Check Point Research
    field: security
    kind: lab_release
    role: task
    language: en
    density: high
    status: UNSTABLE
    serves: [goal-security, task-security-foundation]
    per_source: 6
    why: "漏洞与恶意代码的逆向分析，带具体手法；安全入门最缺的就是这种「看得见的攻击链」。实测会间歇性返回 202 挑战页（锚点 0 个），此时该次抓取记为 INDEX_EMPTY 而不是「今天没更新」"
    indexes:
      - url: "https://research.checkpoint.com/"
        pattern: '^/\d{4}/[a-z0-9-]+$'
        min_anchor_chars: 8
        exclude: ["/category/"]

