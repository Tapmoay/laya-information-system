# 个人信息环境 · 用户配置示例
#
# 复制成 config/user.yaml 后按自己的情况改；或者直接跑：
#   python tools/setup.py
#
# 这份文件只放"环境与个人选择"，不放判断阈值/权重。
# 那些在 state/params/ 里版本化，改它们要走 tools/learn.py 与 docs/38 的变更协议。
#
# 凭据不要写在这里。用环境变量或 ~/.dsh/.credentials.yaml。

schema_version: 1

profile:
  name: default
  language: zh-Hans

demand:
  # 留空 = 自动取 demand/demand-2*.json 里最新的一份
  path: ""

judge:
  # local  = 本机 GPU + Strands Decider（免费、离线、约 5 分钟/200 条）
  # cloud  = DeepSeek API（约 41 秒/200 条，按 token 计费，需要 DEEPSEEK_API_KEY）
  # auto   = 有本地权重用 local，否则有 key 用 cloud
  provider: auto
  local_model: models/strands-decider-2b-local
  device: cuda
  cloud_model: deepseek-flash
  workers: 8
  retries: 2
  timeout: 90
  thinking: disabled

delivery:
  # email = SMTP（需要主机、账号、授权码环境变量）
  # file  = 只落文件，不发送（最安全，适合第一次试跑）
  # none  = 不推送
  channel: file
  email:
    host: ""
    port: 587
    username: ""
    from: ""
    to: []
    # 授权码只从环境变量读，变量名写在这里
    password_env: LAYA_EMAIL_PASSWORD
    starttls: true
    subject_prefix: 每日读物
  file:
    outbox: runs/outbox

crawl:
  max_total: 300
  max_seconds: 900
  embed: true
  # null = 直连；需要时填 http://127.0.0.1:7897
  proxy: null

proxy:
  # 需要代理时填；留空 = 不自动开代理
  url: ""
  port: 7897
  # 无人值守时若端口没开，尝试启动这个程序；留空 = 不启动
  autostart_exe: ""

sources:
  index: config/sources-index.yaml
  # 空列表 = 用登记表里的全部来源；填了就只抓这些 source_id
  only: []
