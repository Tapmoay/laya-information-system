    depends_on: [CAP-SEL-03, CAP-POL-02]

  - capability_id: CAP-SEL-05
    name: decision-emit
    purpose: "输出结构化选择决定：准入、分量、组合角色、决定、理由、策略版本与约束检查。"
    stage: SELECTION
