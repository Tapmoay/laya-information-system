      - name: recency_measurement
        schema_ref: MEASUREMENT-RECORD/1.0
        required: false
        source_capability: CAP-MEA-04
    outputs:
      - name: impact_measurement
        schema_ref: MEASUREMENT-RECORD/1.0
        guarantees: ["不输出对未来的确定性预测"]
    unknown_behavior: ABSTAIN
    forbidden:
      - "仅因版本号更大就判定影响决策"
      - "替代确定性代码执行版本比较"
    external_effects: false
    model_required: true
    trace_fields: [candidate_id, capability_id, label, affected_decision_refs]
    test_strategy:
