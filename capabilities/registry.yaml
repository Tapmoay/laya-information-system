        schema_ref: CANDIDATE-RECORD/1.0
        required: true
        source_capability: CAP-INF-03
    outputs:
      - name: recency_measurement
        schema_ref: MEASUREMENT-RECORD/1.0
        guarantees: ["时间计算可复算", "缺失时间返回 NOT_APPLICABLE"]
    unknown_behavior: NOT_APPLICABLE
    forbidden:
      - "把无法解析的发布时间当作最新"
      - "用抓取时间替代发布时间"
    external_effects: false
    model_required: false
    trace_fields: [candidate_id, published_at, observed_at, age_hours]
    test_strategy:
      - "缺失发布时间返回 NOT_APPLICABLE，而不是 0 天"
      - "跨时区时间在不同机器上必须算出相同结果"
    depends_on: [CAP-INF-03]

  - capability_id: CAP-MEA-05
    name: decision-impact-measure
    purpose: "判断该更新是否可能改变当前决策或路线；具体版本与日期由代码核验。"
