      - "证据不足时返回 ABSTAIN"
    depends_on: [CAP-MEA-01, CAP-MEA-04]

  - capability_id: CAP-MEA-06
    name: maturity-classify
    purpose: "按证据把技术主张归入公告、演示、可复现、可部署、已确立等成熟度状态。"
    stage: MEASUREMENT
    owner_type: MODEL_ADAPTER
    status: CONTRACTED
    milestone: M2
    inputs:
      - name: candidate_text
        schema_ref: TEXT-REPRESENTATION/1.0
        required: true
        source_capability: CAP-INF-06
      - name: evidence_refs
        schema_ref: EVIDENCE-REF/1.0
        required: false
        source_capability: CAP-INF-04
    outputs:
      - name: maturity_measurement
        schema_ref: MEASUREMENT-RECORD/1.0
        guarantees: ["无证据时不得判为可复现或已确立"]
    unknown_behavior: ABSTAIN
    forbidden:
