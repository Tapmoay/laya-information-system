    external_effects: false
    model_required: true
    trace_fields: [candidate_id, label_set, model_revision]
    test_strategy:
      - "S 级必须能说明打破容量的理由"
      - "无法判断时 ABSTAIN，不得默认 B"
    depends_on: [CAP-DEM-02]

  # ---------- SELECTION ----------
  - capability_id: CAP-SEL-01
