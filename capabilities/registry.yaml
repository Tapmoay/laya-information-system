        schema_ref: TEXT-REPRESENTATION/1.0
        required: true
        source_capability: CAP-INF-06
      - name: evidence_refs
        schema_ref: EVIDENCE-REF/1.0
        required: true
        source_capability: CAP-INF-04
    outputs:
