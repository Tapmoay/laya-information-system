registry_version: "1.0.0"
contract_schema: contracts/capability-contract.schema.json
updated_at: "2026-10-18"
authority: "LaYA-technical-roadmap-v0.3.md §3–§5、§8、§9；information-policy.md v0.3 §0.1、§3、§9"

stages:
  - id: POLICY
    business_loop: false
    description: "读取政策与目标文档、计算版本哈希、编译机器可读参数。非业务阶段，不产出候选或推荐。"
  - id: DEMAND
    business_loop: true
    description: "把政策与目标编译成本轮需求快照与监测范围。"
  - id: INFORMATION
    business_loop: true
    description: "按检索计划抓取、规范化、去重、识别语言，生成可追溯的衍生文本。"
  - id: MEASUREMENT
    business_loop: true
    description: "在证据允许范围内测量候选属性。测量不等于决策。"
  - id: SELECTION
    business_loop: true
    description: "确定性准入、组合、容量与弃权。冻结约束 RULE_ENGINE_NO_MODEL。"
  - id: DELIVERY
    business_loop: true
    description: "装配结构化交付对象、渲染并推送。呈现层不得新增事实或改动选择。"
  - id: RUNTIME
    business_loop: false
    description: "单轮运行管理：锁、状态机、检查点、运行清单与资源释放。非业务阶段。"
  - id: FEEDBACK
    business_loop: true
    description: "记录用户明示、可观测行为与 Agent 推断，三者分开存储。"
  - id: POLICY_UPDATE
    business_loop: true
    description: "离线评估规则变更，经人工闸门激活或回滚。"

invariants:
  - id: INV-01
    rule: "capability_id 全局唯一，格式为 CAP-<阶段码>-NN。"
    enforced_by: schema+validator
    rationale: "能力是审计与追溯的稳定引用单元，ID 冲突会让追溯失效。"
  - id: INV-02
    rule: "stage=SELECTION 的能力只能由 RULE_SET 或 DETERMINISTIC_CODE 拥有，且 model_required 必须为 false。"
    enforced_by: schema+validator
    rationale: "落实冻结约束 RULE_ENGINE_NO_MODEL：选择阶段不得调用模型。"
  - id: INV-03
    rule: "model_required=true 的能力，owner_type 必须是 MODEL_ADAPTER、HYBRID 或 AI_AGENT。"
    enforced_by: validator
    rationale: "避免确定性规则能力伪装成模型能力，也避免模型能力伪装成代码。"
  - id: INV-04
    rule: "owner_type=MODEL_ADAPTER 的能力，model_required 必须为 true。"
    enforced_by: validator
    rationale: "适配器能力的存在理由就是调用模型，否则应降级为代码能力。"
  - id: INV-05
    rule: "depends_on 引用的能力必须存在，不得自引用，依赖图必须无环。"
    enforced_by: validator
    rationale: "依赖图必须可拓扑排序，否则阶段编排顺序不可验证。"
  - id: INV-06
    rule: "stages 中声明的每个阶段至少有一个能力。"
    enforced_by: validator
    rationale: "避免某个环节只有文字描述、没有可验收契约。"
  - id: INV-07
    rule: "每个能力至少声明一个 trace_field，且同一能力内不得重复。"
    enforced_by: validator
    rationale: "没有追溯字段的能力无法在 RunManifest 中复核。"
  - id: INV-08
    rule: "capability_id 与 name 中不得出现具体模型或厂商名称。"
    enforced_by: validator
    rationale: "模型必须可替换；能力标识一旦绑定厂商就无法安全换模型。"
  - id: INV-09
    rule: "external_effects=true 的能力必须声明 authorization_basis。"
    enforced_by: schema+validator
    rationale: "外部高影响动作必须有明确授权依据，不得默认执行。"
  - id: INV-10
    rule: "external_effects=true 只允许出现在 DELIVERY 或 POLICY_UPDATE 阶段。"
    enforced_by: validator
    rationale: "政策读取、检索、测量与选择阶段不得产生外部副作用。"
  - id: INV-11
    rule: "业务阶段依赖必须单向：能力不得依赖业务循环中更靠后的阶段（RUNTIME 横切，不参与）。"
    enforced_by: validator
    rationale: "阶段顺序被倒置会让编排出现循环等待，且说明职责边界已经混乱。"

capabilities:
  # ---------- POLICY ----------
  - capability_id: CAP-POL-01
    name: policy-bundle-load
    purpose: "读取当前有效的政策、目标文档与版本元数据，产出带哈希的政策包；版本不一致时阻止本轮继续。"
    stage: POLICY
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M1
    notes: "实现：policy/loader.py（读真实政策文件、抽顶部与 §10 自述版本、检出 C-01 冲突并给出三态）"
    inputs:
      - name: policy_doc_path
        schema_ref: POLICY-DOC/1.0
        required: true
        source_capability: null
      - name: goal_doc_paths
        schema_ref: GOAL-DOC-SET/1.0
        required: true
        source_capability: null
    outputs:
      - name: policy_bundle
        schema_ref: POLICY-BUNDLE/1.0
        guarantees: ["记录每个输入文件的内容哈希", "记录文档自述版本，但不把它当作已核实版本"]
    unknown_behavior: ERROR
    forbidden:
      - "在检测不到有效政策版本时使用内置默认值继续运行"
      - "把文档自述版本直接当作本轮实际版本"
    external_effects: false
    model_required: false
    trace_fields: [policy_version, policy_hash, goal_doc_versions]
    test_strategy:
      - "缺失政策文件必须返回 ERROR，而不是空政策包"
      - "同一文件重复读取的哈希必须稳定"
    depends_on: []

  - capability_id: CAP-POL-02
    name: machine-config-compile
    purpose: "把政策中的通道、容量上限与语言默认值编译为机器可读配置，并校验配置与政策版本一致。"
    stage: POLICY
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M1
    notes: "实现：policy/compiler.py（容量从 §3.8 原文抽取，抽不到就报错，不给默认值）"
    inputs:
      - name: policy_bundle
        schema_ref: POLICY-BUNDLE/1.0
        required: true
        source_capability: CAP-POL-01
    outputs:
      - name: machine_policy_config
        schema_ref: POLICY-CONFIG/1.0
        guarantees: ["容量上限带来源条款引用", "缺少关键上限时编译失败"]
    unknown_behavior: INVALID
    forbidden:
      - "在代码中另存一份会与政策文件漂移的容量上限副本"
      - "把上限解释为必须填满的配额"
    external_effects: false
    model_required: false
    trace_fields: [policy_version, config_hash, capacity_limits]
    test_strategy:
      - "缺少关键上限时配置编译必须失败"
      - "上限字段不得被改写为配额下限"
    depends_on: [CAP-POL-01]

  # ---------- DEMAND ----------
  - capability_id: CAP-DEM-01
    name: demand-snapshot-build
    purpose: "依据政策包、目标文档与近期任务生成本轮需求快照，并把推断目标明确标注为候选。"
    stage: DEMAND
    owner_type: HYBRID
    status: CONTRACTED
    milestone: M2
    inputs:
      - name: policy_bundle
        schema_ref: POLICY-BUNDLE/1.0
        required: true
        source_capability: CAP-POL-01
      - name: goal_docs
        schema_ref: GOAL-DOC-SET/1.0
        required: true
        source_capability: CAP-POL-01
    outputs:
      - name: demand_snapshot
        schema_ref: DEMAND-SNAPSHOT/1.0
        guarantees: ["推断项带 CANDIDATE_INFERRED 状态", "不修改用户已确认的长期目标"]
    unknown_behavior: PARTIAL
    forbidden:
      - "把 CANDIDATE_INFERRED 目标写成 ACTIVE_EXPLICIT"
      - "在没有用户明示时改写长期目标"
    external_effects: false
    model_required: true
    trace_fields: [demand_snapshot_id, goal_state_counts, assumption_refs]
    test_strategy:
      - "目标文档缺失时产出带 unknowns 的快照并标 PARTIAL"
      - "推断目标不得出现在 active_goals 中"
    depends_on: [CAP-POL-01, CAP-POL-02]

  - capability_id: CAP-DEM-02
    name: monitoring-profile-derive
    purpose: "从需求快照推导本轮监测问题、主题、邻接领域与排除项，并记录推导依据。"
    stage: DEMAND
    owner_type: HYBRID
    status: CONTRACTED
    milestone: M2
    inputs:
      - name: demand_snapshot
        schema_ref: DEMAND-SNAPSHOT/1.0
        required: true
        source_capability: CAP-DEM-01
    outputs:
      - name: monitoring_profile
        schema_ref: MONITORING-PROFILE/1.0
        guarantees: ["每个主题可追溯到具体监测问题", "排除项带理由"]
    unknown_behavior: PARTIAL
    forbidden:
      - "用固定技术白名单替代从目标推导"
      - "为每个新术语建立重复监测项"
    external_effects: false
    model_required: true
    trace_fields: [monitoring_profile_id, derived_from_demand, rationale_refs]
    test_strategy:
      - "监测主题必须能追溯到需求条目"
      - "同一需求重复推导不得无限扩张主题数量"
    depends_on: [CAP-DEM-01]

  # ---------- INFORMATION ----------
  - capability_id: CAP-INF-01
    name: query-plan-generate
    purpose: "为每个监测问题生成多语言检索计划，记录每条查询的语言、变体与生成依据。"
    stage: INFORMATION
    owner_type: HYBRID
    status: CONTRACTED
    milestone: M2
    inputs:
      - name: monitoring_profile
        schema_ref: MONITORING-PROFILE/1.0
        required: true
        source_capability: CAP-DEM-02
    outputs:
      - name: query_plan
        schema_ref: QUERY-PLAN/1.0
        guarantees: ["每条查询挂到具体监测问题", "记录使用的语言集合"]
    unknown_behavior: PARTIAL
    forbidden:
      - "只生成单一语言查询而不记录理由"
      - "把检索语言隐式固定为某一种"
    external_effects: false
    model_required: true
    trace_fields: [query_plan_id, languages_used, query_to_question_map]
    test_strategy:
      - "每条查询必须能映射回监测问题"
      - "语言集合必须与推导依据或配置一致"
    depends_on: [CAP-DEM-02]

  - capability_id: CAP-INF-02
    name: source-fetch
    purpose: "执行检索计划中的抓取与请求，记录来源地址、时间、超时、重试与最终状态。"
    stage: INFORMATION
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：ingest/fetch.py（白名单默认拒绝 + robots + 有限重试 + 字节上限 + 字符集嗅探）；链接发现见 ingest/discover.py，端到端抓取见 tools/crawl.py。单元测试跑在本机 HTTP 服务器上；tools/crawl.py 会访问登记表里的公网来源，取证链见 docs/22-crawl-provenance.md"
    inputs:
      - name: query_plan
        schema_ref: QUERY-PLAN/1.0
        required: true
        source_capability: CAP-INF-01
    outputs:
      - name: fetch_results
        schema_ref: FETCH-RESULT/1.0
        guarantees: ["失败带 HTTP 状态或异常类型", "重试次数有上限"]
    unknown_behavior: ERROR
    forbidden:
      - "把抓取失败记录为没有相关内容"
      - "在返回内容为空时推断来源已删除"
    external_effects: false
    model_required: false
    trace_fields: [request_id, url, http_status, attempt, elapsed_ms]
    test_strategy:
      - "超时必须记为 ERROR 并进入有限重试"
      - "重试次数达到上限后停止"
    depends_on: [CAP-INF-01]

  - capability_id: CAP-INF-03
    name: candidate-normalize
    purpose: "对抓取结果做 URL 规范化、时间解析、内容哈希与字段校验，产出候选记录。"
    stage: INFORMATION
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：ingest/{urls,normalize,dedupe}.py；测试：tests/test_ingest.py"
    inputs:
      - name: fetch_results
        schema_ref: FETCH-RESULT/1.0
        required: true
        source_capability: CAP-INF-02
    outputs:
      - name: candidate_records
        schema_ref: CANDIDATE-RECORD/1.0
        guarantees: ["规范化结果在同一版本下可重复", "无法解析的时间标 UNKNOWN"]
    unknown_behavior: INVALID
    forbidden:
      - "对无法解析的发布时间填默认值"
      - "用未规范化的 URL 作为去重键"
    external_effects: false
    model_required: false
    trace_fields: [candidate_id, canonical_url, content_digest, normalize_version]
    test_strategy:
      - "同一 URL 的不同写法必须归一到同一键"
      - "缺失发布时间标 UNKNOWN，而不是当天"
    depends_on: [CAP-INF-02]

  - capability_id: CAP-INF-04
    name: source-identity-resolve
    purpose: "区分发布者与实际上游来源，用确定性证据规则建立来源身份链；证据不足保留 UNKNOWN。"
    stage: INFORMATION
    owner_type: RULE_SET
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：ingest/identity.py（canonical link / upstream hint / 无信号→UNKNOWN）；independence_count 保证多转载只算一个证据"
    inputs:
      - name: candidate_records
        schema_ref: CANDIDATE-RECORD/1.0
        required: true
        source_capability: CAP-INF-03
    outputs:
      - name: identity_evidence
        schema_ref: SOURCE-IDENTITY/1.0
        guarantees: ["publisher 与 upstream_source 分别表达", "证据不足时状态为 UNKNOWN"]
    unknown_behavior: UNKNOWN
    forbidden:
      - "仅凭语气或排版把转载判为原始来源"
      - "在证据不足时把 publisher 标为已确认"
    external_effects: false
    model_required: false
    trace_fields: [source_identity_status, publisher, upstream_source, evidence_refs]
    test_strategy:
      - "多条转载指向同一上游时只计一个独立证据"
      - "身份无法证明时保持 UNKNOWN"
    depends_on: [CAP-INF-03]

  - capability_id: CAP-INF-05
    name: language-identify
    purpose: "识别候选的来源语言与识别方法，混合语种或低置信时标记 MIXED 或 UNKNOWN。"
    stage: INFORMATION
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：ingest/language.py（汉字数 vs 英文词数启发式，说不清就 UNKNOWN）；若将来引入模型检测需改回 HYBRID 并升契约"
    inputs:
      - name: candidate_records
        schema_ref: CANDIDATE-RECORD/1.0
        required: true
        source_capability: CAP-INF-03
    outputs:
      - name: language_observation
        schema_ref: LANGUAGE-OBSERVATION/1.0
        guarantees: ["记录识别方法与置信度", "不确定时不输出单一语种"]
    unknown_behavior: UNKNOWN
    forbidden:
      - "把识别不确定的语种记为已确认"
      - "根据域名国别推断内容语言"
    external_effects: false
    model_required: false
    # 当前是脚本启发式；模型路径未启用
    trace_fields: [source_language, language_method, language_confidence]
    test_strategy:
      - "混合语种样本必须标记 MIXED"
      - "低置信结果不得直接写 zh-Hans 或 en"
    depends_on: [CAP-INF-03]

  - capability_id: CAP-INF-06
    name: text-representation-build
    purpose: "生成可追溯的翻译或摘要文本对象，保留原文引用、方法与语义风险标记。"
    stage: INFORMATION
    owner_type: HYBRID
    status: CONTRACTED
    milestone: M2
    inputs:
      - name: candidate_records
        schema_ref: CANDIDATE-RECORD/1.0
        required: true
        source_capability: CAP-INF-03
      - name: language_observation
        schema_ref: LANGUAGE-OBSERVATION/1.0
        required: false
        source_capability: CAP-INF-05
    outputs:
      - name: text_representations
        schema_ref: TEXT-REPRESENTATION/1.0
        guarantees: ["每个衍生对象带 derived_from_refs", "不覆盖原文"]
    unknown_behavior: PARTIAL
    forbidden:
      - "用译文覆盖原文"
      - "把译文当作独立证据来源"
    external_effects: false
    model_required: true
    trace_fields: [text_representation_id, representation_type, method_profile_id]
    test_strategy:
      - "译文必须能定位回原文来源"
      - "含否定、数字或条件改写的译文必须带语义风险标记"
    depends_on: [CAP-INF-03, CAP-INF-05]

  # ---------- MEASUREMENT ----------
  - capability_id: CAP-MEA-01
    name: decision-invoke
    purpose: "以统一契约调用测量适配器，把模型或规则返回映射为带状态的测量结果；不解释内容。"
    stage: MEASUREMENT
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：capabilities/adapters/models/{invoke,measurement,registry}.py；只有测试桩，无真实模型"
    inputs:
      - name: decision_request
        schema_ref: DECISION-REQUEST/1.1
        required: true
        source_capability: CAP-INF-03
    outputs:
      - name: decision_result
        schema_ref: DECISION-RESULT/1.1
        guarantees: ["适配器异常映射为 ERROR", "probabilities 可缺省且原因可追溯"]
    unknown_behavior: ERROR
    forbidden:
      - "让适配器的私有输出字段泄漏到业务层"
      - "把未校准分数伪装成概率"
    external_effects: false
    model_required: false
    trace_fields: [request_id, adapter_version, model_profile_id, model_revision]
    test_strategy:
      - "适配器抛异常时映射为 ERROR，而不是 UNKNOWN"
      - "probabilities 缺省时仍能安全进入测量记录"
    depends_on: [CAP-INF-03]

  - capability_id: CAP-MEA-02
    name: relevance-measure
    purpose: "判断候选与本轮需求的关系类别（直接、邻接、探索、无关、证据不足），并给出证据引用。"
    stage: MEASUREMENT
    owner_type: MODEL_ADAPTER
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：capabilities/adapters/models/qwen_local.py + MODEL-PROFILE-QWEN25-3B（仅 zh-Hans 经评测验证；英文路径返回 OUT_OF_VALIDATED_LANGUAGE_SCOPE）"
    inputs:
      - name: candidate_text
        schema_ref: TEXT-REPRESENTATION/1.0
        required: true
        source_capability: CAP-INF-06
      - name: demand_snapshot
        schema_ref: DEMAND-SNAPSHOT/1.0
        required: true
        source_capability: CAP-DEM-01
    outputs:
      - name: relevance_measurement
        schema_ref: MEASUREMENT-RECORD/1.0
        guarantees: ["标签来自固定选项集", "记录判断语言与输入表示"]
    unknown_behavior: ABSTAIN
    forbidden:
      - "输出最终推荐决定"
      - "在缺少候选正文时仅凭标题强判"
    external_effects: false
    model_required: true
    trace_fields: [candidate_id, capability_id, label, judgment_language, input_representation]
    test_strategy:
      - "证据不足样本应倾向 ABSTAIN"
      - "选项顺序变化不得导致无理翻转"
    depends_on: [CAP-MEA-01]

  - capability_id: CAP-MEA-03
    name: growth-value-measure
    purpose: "评估候选是否提供可迁移机制、可验证实践或当前能力缺口所需的知识。"
    stage: MEASUREMENT
    owner_type: MODEL_ADAPTER
    status: CONTRACTED
    milestone: M2
    inputs:
      - name: candidate_text
        schema_ref: TEXT-REPRESENTATION/1.0
        required: true
        source_capability: CAP-INF-06
      - name: demand_snapshot
        schema_ref: DEMAND-SNAPSHOT/1.0
        required: true
        source_capability: CAP-DEM-01
    outputs:
      - name: growth_value_measurement
        schema_ref: MEASUREMENT-RECORD/1.0
        guarantees: ["结论限定在能力价值范围内"]
    unknown_behavior: ABSTAIN
    forbidden:
      - "把热度或讨论量当作能力价值"
      - "在没有机制描述时给出高确定性结论"
    external_effects: false
    model_required: true
    trace_fields: [candidate_id, capability_id, label, evidence_refs]
    test_strategy:
      - "只有标题的样本不得给出高确定性等级"
      - "同一输入重复调用不得出现标签抖动"
    depends_on: [CAP-MEA-01]

  - capability_id: CAP-MEA-04
    name: recency-compute
    purpose: "用确定性代码计算发布时间、观测时间与新鲜度；不做语义判断。"
    stage: MEASUREMENT
    owner_type: DETERMINISTIC_CODE
