        guarantees: ["检查点带输入与配置哈希", "版本不一致时拒绝复用"]
    unknown_behavior: PARTIAL
    forbidden:
      - "复用版本不一致的阶段产物"
      - "因检查点复用导致重复推送"
    external_effects: false
    model_required: false
    trace_fields: [checkpoint_id, input_hash, config_hash, stage]
    test_strategy:
      - "输入哈希变化后检查点必须失效"
      - "复用检查点不得触发第二次推送"
    depends_on: [CAP-RUN-01]

  - capability_id: CAP-RUN-03
    name: run-manifest-persist
    purpose: "持久化本轮运行清单：触发方式、版本、模型 revision、阶段状态、错误与产物引用。"
    stage: RUNTIME
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M1
    notes: "实现：runtime/manifest.py + runtime/offline_run.py:on_complete；失败也写清单（errors.json 存正文）"
    inputs:
      - name: run_state
        schema_ref: RUN-STATE/1.0
        required: true
        source_capability: CAP-RUN-01
    outputs:
      - name: run_manifest
        schema_ref: RUN-MANIFEST/1.0
        guarantees: ["失败与弃权与成功同样被记录", "记录模型不可变 revision"]
    unknown_behavior: ERROR
    forbidden:
      - "只保存成功结果不保存失败与弃权"
      - "把长篇内部推理写入运行清单"
    external_effects: false
    model_required: false
    trace_fields: [run_id, policy_version, model_revisions, stage_statuses]
    test_strategy:
      - "中途失败的 run 也必须留下清单"
      - "清单不得包含凭据或完整敏感正文"
    depends_on: [CAP-RUN-01]

  - capability_id: CAP-RUN-04
    name: scheduler-entry
    purpose: "按显式时区与日历规则触发一次入口程序，并按策略处理错过的计划时刻。"
    stage: RUNTIME
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M2
    notes: "实现：runtime/schedule.py + runtime/scheduled_entry.py；OS 级定时器由部署配置负责，程序只做决策与单轮执行"
    inputs:
      - name: run_state
        schema_ref: RUN-STATE/1.0
        required: true
        source_capability: CAP-RUN-01
    outputs:
      - name: trigger_record
        schema_ref: TRIGGER-RECORD/1.0
        guarantees: ["时区显式记录", "misfire 策略可审计"]
    unknown_behavior: ERROR
    forbidden:
      - "依赖主机隐式时区"
      - "在错过计划时刻后补跑多轮"
    external_effects: false
    model_required: false
    trace_fields: [scheduled_at, actual_start, timezone, misfire_policy]
    test_strategy:
      - "时区未显式配置时拒绝启用调度"
      - "睡眠唤醒后最多补跑一轮"
    depends_on: [CAP-RUN-01]

  - capability_id: CAP-RUN-05
    name: resource-release
    purpose: "释放模型显存、子进程、临时文件与锁，确认进程可以退出。"
    stage: RUNTIME
    owner_type: DETERMINISTIC_CODE
    status: CONTRACTED
    milestone: M1
    inputs:
      - name: run_state
        schema_ref: RUN-STATE/1.0
        required: true
        source_capability: CAP-RUN-01
    outputs:
      - name: release_report
        schema_ref: RESOURCE-RELEASE/1.0
        guarantees: ["逐项记录释放结果", "失败可见"]
    unknown_behavior: PARTIAL
    forbidden:
      - "在仍有子进程存活时报告已释放"
      - "把清理失败当作运行成功"
    external_effects: false
    model_required: false
    trace_fields: [vram_released_mb, child_processes, lock_released]
    test_strategy:
      - "模型加载后必须观察到显存回落"
      - "锁未释放时下一次运行必须被拒绝"
    depends_on: [CAP-RUN-01]

  # ---------- FEEDBACK ----------
  - capability_id: CAP-FBK-01
    name: feedback-capture
    purpose: "记录用户直接反馈、可观测行为与 Agent 推断，三者分开存储。"
    stage: FEEDBACK
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M3
    notes: "实现：feedback/capture.py；三类反馈在 schema 层互斥；测试：tests/test_feedback.py"
    inputs:
      - name: delivery_record
        schema_ref: DELIVERY-STATUS/1.0
        required: true
        source_capability: CAP-DEL-04
    outputs:
      - name: feedback_records
        schema_ref: FEEDBACK-RECORD/1.0
        guarantees: ["明示、观察、推断三类字段不混用"]
    unknown_behavior: MISSING
    forbidden:
      - "把点击或停留直接当作用户收益"
      - "在没有反馈时补造反馈"
    external_effects: false
    model_required: false
    trace_fields: [feedback_id, feedback_type, captured_at, source]
    test_strategy:
      - "无反馈时字段为 MISSING 而不是默认值"
      - "推断字段不得写入用户明示字段"
    depends_on: [CAP-DEL-04]

  - capability_id: CAP-FBK-02
    name: outcome-association
    purpose: "把推荐与后续实际使用、验证结果关联，并标注观察状态。"
    stage: FEEDBACK
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M3
    notes: "实现：feedback/outcome.py（只做确定性关联，不做语义推断）；证据缺失时只能 UNKNOWN + NOT_EVALUATED"
    inputs:
      - name: feedback_records
        schema_ref: FEEDBACK-RECORD/1.0
        required: true
        source_capability: CAP-FBK-01
    outputs:
      - name: outcome_records
        schema_ref: OUTCOME-RECORD/1.0
        guarantees: ["区分已观察、部分观察与未观察"]
    unknown_behavior: UNKNOWN
    forbidden:
      - "用主观兴奋感确认收益"
      - "推断用户未表达的个人情况"
    external_effects: false
    model_required: false
    trace_fields: [candidate_id, outcome_status, evidence_refs]
    test_strategy:
      - "没有可观察证据时只能标未观察"
      - "不得把推荐失败直接归因于用户"
    depends_on: [CAP-FBK-01]

  - capability_id: CAP-FBK-03
    name: policy-change-propose
    purpose: "基于重复观察到的问题提出规则变更提案，默认停在 PROPOSED 或 TRIAL。"
    stage: FEEDBACK
    owner_type: AI_AGENT
    status: PROPOSED
    milestone: M3
    notes: "提案构造器已实现（feedback/proposal.py），但'该改什么'的判断仍由 Agent 负责，尚未接入"
    inputs:
      - name: outcome_records
        schema_ref: OUTCOME-RECORD/1.0
        required: true
        source_capability: CAP-FBK-02
    outputs:
      - name: policy_proposals
        schema_ref: POLICY-PROPOSAL/1.0
        guarantees: ["每条提案带触发观察与回滚条件"]
    unknown_behavior: ABSTAIN
    forbidden:
      - "直接激活会改变政策原则的规则"
      - "为提高推荐量而修改目标"
    external_effects: false
    model_required: true
    trace_fields: [proposal_id, rule_id, status, evidence_refs]
    test_strategy:
      - "提案不得直接进入 ACTIVE"
      - "一次观察到的问题不得自动生成永久规则"
    depends_on: [CAP-FBK-02]

  - capability_id: CAP-FBK-04
    name: observation-detect
    purpose: "从多轮运行清单与反馈里找出反复出现的模式，并附上证据；不建议改法。"
    stage: FEEDBACK
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M3
    notes: "实现：feedback/detector.py（窗口内计数，窗口与阈值可配）；只输出观察，提案仍由 FBK-03 负责"
    inputs:
      - name: run_manifests
        schema_ref: RUN-MANIFEST/1.0
        required: true
        source_capability: CAP-RUN-03
      - name: feedback_records
        schema_ref: FEEDBACK-RECORD/1.0
        required: false
        source_capability: CAP-FBK-01
    outputs:
      - name: observations
        schema_ref: OBSERVATION/1.0
        guarantees: ["每条观察至少带一个运行证据引用", "只描述模式，不给改法"]
    unknown_behavior: MISSING
    forbidden:
      - "在证据不足时报告趋势"
      - "把一次异常升级为长期结论"
    external_effects: false
    model_required: false
    trace_fields: [code, window, evidence_refs]
    test_strategy:
      - "窗口内不足阈值时不产生观察"
      - "观察必须带可点击的运行清单引用"
      - "检测器不修改任何策略"
    depends_on: [CAP-RUN-03, CAP-FBK-01]

  # ---------- POLICY_UPDATE ----------
  - capability_id: CAP-PUP-01
    name: policy-diff-evaluate
    purpose: "在离线历史输入上重跑选择，比较规则变更前后的候选差异与副作用。"
    stage: POLICY_UPDATE
    owner_type: DETERMINISTIC_CODE
    status: IMPLEMENTED
    milestone: M3
    notes: "实现：feedback/policy_diff.py；通道变少时 squeezes 为空会被校验器拦下"
    inputs:
      - name: policy_proposals
        schema_ref: POLICY-PROPOSAL/1.0
        required: true
        source_capability: CAP-FBK-03
    outputs:
      - name: policy_diff_report
        schema_ref: POLICY-DIFF-REPORT/1.0
        guarantees: ["报告改善与挤压两类影响"]
    unknown_behavior: ERROR
    forbidden:
      - "用变更后的新规则重新标注历史结果"
      - "只报告改善不报告挤压"
    external_effects: false
    model_required: false
    trace_fields: [proposal_id, affected_candidates, channel_deltas]
    test_strategy:
      - "同一历史输入重复评估结果一致"
      - "报告必须列出受挤压的通道"
    depends_on: [CAP-FBK-03]

  - capability_id: CAP-PUP-02
    name: rule-activation-gate
    purpose: "由人工确认规则激活、退役或回滚，保留版本与回滚路径。"
    # 实现：feedback/activation.py + feedback/policy_store.py（人工签名 + 不可变版本 + 回滚）
    stage: POLICY_UPDATE
    owner_type: HUMAN_GATE
    status: IMPLEMENTED
    milestone: M3
    notes: "实现：feedback/activation.py（人工签名 + 不可变版本 + 回滚）；界面仍未做，目前由代码调用"
    inputs:
      - name: policy_diff_report
        schema_ref: POLICY-DIFF-REPORT/1.0
        required: true
        source_capability: CAP-PUP-01
    outputs:
      - name: policy_activation_record
        schema_ref: POLICY-ACTIVATION/1.0
        guarantees: ["记录批准人、时间与回滚条件"]
    unknown_behavior: ABSTAIN
    forbidden:
      - "由 Agent 自行激活 L0 或 L1 变更"
      - "删除旧版本记录"
    external_effects: true
    authorization_basis: "HUMAN_GATE：规则激活必须由用户显式确认"
    model_required: false
    trace_fields: [rule_id, approved_by, activated_at, rollback_condition]
    test_strategy:
      - "未经人工确认的提案不得进入 ACTIVE"
      - "回滚必须能还原旧版本"
    depends_on: [CAP-PUP-01]
