# 对象契约夹具清单。
# 每个夹具都必须声明期望结果；valid 若失败、invalid 若通过，都算契约回归。
# error_contains 用于确认"失败原因确实是我们要拦的那一条"，避免凑巧因为别的字段报错而通过测试。
fixtures:
  # ---------------- candidate-record ----------------
  - type: candidate-record
    path: candidate-record/valid/minimal.json
    expect: valid
  - type: candidate-record
    path: candidate-record/boundary/mixed-language-unknown-date.json
    expect: valid
  - type: candidate-record
    path: candidate-record/boundary/upstream-confirmed.json
    expect: valid
  - type: candidate-record
    path: candidate-record/invalid/publisher-confirmed-without-evidence.json
    expect: invalid
    error_contains: evidence_refs
  - type: candidate-record
    path: candidate-record/invalid/published-known-with-unknown-state.json
    expect: invalid
    error_contains: published_at
  - type: candidate-record
    path: candidate-record/invalid/retrieval-error-without-state.json
    expect: invalid
    error_contains: state
  - type: candidate-record
    path: candidate-record/invalid/url-not-http.json
    expect: invalid
    error_contains: canonical_url
  - type: candidate-record
    path: candidate-record/invalid/unknown-language-with-html-method.json
    expect: invalid
    error_contains: method
  - type: candidate-record
    path: candidate-record/invalid/missing-canonical-url.json
    expect: invalid
    error_contains: canonical_url

  # ---------------- measurement-record ----------------
  - type: measurement-record
    path: measurement-record/valid/relevance-model.json
