    expect: valid
  - type: measurement-record
    path: measurement-record/invalid/value-with-abstain.json
    expect: invalid
    error_contains: value
  - type: measurement-record
    path: measurement-record/invalid/ok-without-evidence.json
    expect: invalid
    error_contains: evidence_refs
  - type: measurement-record
    path: measurement-record/invalid/model-without-revision.json
    expect: invalid
    error_contains: model_revision
  - type: measurement-record
    path: measurement-record/invalid/uncalibrated-probabilities.json
    expect: invalid
    error_contains: calibration_profile_id
  - type: measurement-record
    path: measurement-record/invalid/label-not-in-set.json
    expect: invalid
    error_contains: 不在
  - type: measurement-record
    path: measurement-record/invalid/reason-status-mismatch.json
    expect: invalid
    error_contains: 不相容
  - type: measurement-record
    path: measurement-record/invalid/label-set-version.json
    expect: invalid
